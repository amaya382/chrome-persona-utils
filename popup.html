<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Persona Utils</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 460px;
        padding: 12px;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 0 0 8px;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .source {
        color: var(--muted);
        font-size: 11px;
      }
      #rules {
        list-style: none;
        margin: 0 0 8px;
        padding: 0;
      }
      #rules label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Persona Utils</h1>
      <label class="row"><input type="checkbox" id="enabled" /> Enabled</label>
    </div>
    <p id="status" class="error" hidden></p>
    <section class="card">
      <h2>On this page</h2>
      <dl id="effective"></dl>
      <p class="note">Header changes apply to the next request. User agent, locale, and cookie overrides in JavaScript apply after a reload.</p>
      <button type="button" id="reload">Reload page</button>
    </section>
    <section class="card">
      <h2 class="row"><input type="checkbox" id="globalEnabled" /> Global</h2>
      <p class="note">Applies to every page and takes priority over URL rules.</p>
      <div id="globalEditor"></div>
    </section>
    <section class="card">
      <h2>Matching URL rules</h2>
      <ul id="rules"></ul>
      <a href="#" id="openOptions">Manage URL rules</a>
    </section>
    <script src="presets.js"></script>
    <script src="core.js"></script>
    <script src="storage.js"></script>
    <script src="profile-editor.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
