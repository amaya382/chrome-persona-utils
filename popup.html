<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Persona Utils</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 460px;
        padding: 12px;
      }
      .tabs {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        border-bottom: 1px solid var(--border);
        margin: 0 0 10px;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: none;
        max-width: 150px;
        padding: 5px 8px;
        border: 1px solid transparent;
        border-bottom: none;
        border-radius: 6px 6px 0 0;
        cursor: pointer;
        white-space: nowrap;
      }
      .tab span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tab.active {
        border-color: var(--border);
        font-weight: bold;
      }
      .tab.off span {
        color: var(--muted);
      }
      .tab.add {
        color: var(--accent);
        font-weight: bold;
      }
      .tab.add[aria-disabled='true'] {
        opacity: 0.4;
        cursor: default;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 0 0 8px;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .source {
        color: var(--muted);
        font-size: 11px;
      }
      .rule-fields {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 4px 8px;
        margin: 0 0 10px;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Persona Utils</h1>
      <label class="row"><input type="checkbox" id="enabled" /> Enabled</label>
    </div>
    <p id="status" class="error" hidden></p>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="panel"></div>
    <div class="footer">
      <button type="button" id="reload">Reload page</button>
      <a href="#" id="openOptions">Manage URL rules</a>
    </div>
    <script src="presets.js"></script>
    <script src="core.js"></script>
    <script src="storage.js"></script>
    <script src="profile-editor.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
